<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="form-container">
        <h2>Регистрация</h2>
        
        {% for category, message in get_flashed_messages(with_categories=true) %}
            <div class="message {{ category }}">{{ message }}</div>
        {% endfor %}
        
        <form id="registerForm" method="POST" action="/register">
            <div class="form-group">
                <label for="username">Имя пользователя (латиница и цифры, 3-20 символов):</label>
                <input type="text" id="username" name="username" required>
            </div>
            
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
            </div>
            
            <div class="form-group">
                <label for="password">Пароль (мин. 6 символов, буквы + цифры):</label>
                <input type="password" id="password" name="password" required>
            </div>
            
            <div class="form-group">
                <label for="confirm_password">Подтверждение пароля:</label>
                <input type="password" id="confirm_password" name="confirm_password" required>
            </div>
            
            <div class="form-group">
                <label for="captcha">Капча: Сколько будет {{ num1 }} + {{ num2 }}?</label>
                <input type="number" id="captcha" name="captcha" required>
            </div>
            
            <button type="submit">Зарегистрироваться</button>
        </form>
        
        <p class="center">
            <a href="/login" class="link">Уже есть аккаунт? Войти</a>
        </p>
    </div>
    
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
